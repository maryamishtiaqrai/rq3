# Final reported CLIP-FR operating point
detector_pair:
  - YOLOv8x
  - YOLOv8l

detector_inference:
  image_size: 640
  low_confidence_threshold: 0.001
  nms_iou_threshold: 0.70
  max_detections: 300

wbf:
  iou_threshold: 0.55
  detector_weights: equal
  confidence_type: average
  confidence_rescaling: minimum
  baseline_threshold: 0.25

clip_fr:
  semantic_support: entropy
  direct_acceptance_threshold: 0.50
  recovery_minimum_threshold: 0.15
  entropy_threshold: 0.20
  recovery_duplicate_iou: 0.50
